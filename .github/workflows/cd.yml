# CD 파이프라인: main 브랜치에 push 되면 자동 실행
name: CD Pipeline

on:
  push:
    branches: [ main ]    # main에 merge 될 때만 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 💡 사용할 Secrets를 작업(Job) 전체의 환경 변수로 등록합니다.
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      # 소스코드 가져오기
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # ── [추가] 백엔드 빌드 단계 ──
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Maven 빌드 (jar 파일 생성)
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests
          cd ..

      # ── [추가] 프런트엔드 빌드 단계 ──
      - name: Node.js 18 설정
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 의존성 설치 & 빌드
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      # ── Docker Hub 로그인 및 푸시 단계 ──
      # Docker Hub 로그인 (env 변수 사용)
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_TOKEN }}

      # 1. 백엔드 이미지 빌드 (태그 동시 지정)
      - name: Backend Docker Build
        run: |
          docker build -t $DOCKER_USER/yj-backend:${{ github.sha }} ./backend
          docker tag $DOCKER_USER/yj-backend:${{ github.sha }} $DOCKER_USER/yj-backend:latest

      # 2. 프런트엔드 이미지 빌드 (태그 동시 지정)
      - name: Frontend Docker Build
        run: |
          docker build -t $DOCKER_USER/yj-frontend:${{ github.sha }} ./frontend
          docker tag $DOCKER_USER/yj-frontend:${{ github.sha }} $DOCKER_USER/yj-frontend:latest

      # 3. Docker Hub에 Push
      - name: Docker Hub Push
        run: |
          docker push $DOCKER_USER/yj-backend:${{ github.sha }}
          docker push $DOCKER_USER/yj-backend:latest
          docker push $DOCKER_USER/yj-frontend:${{ github.sha }}
          docker push $DOCKER_USER/yj-frontend:latest
